<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Produk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="product-detail container">
    <img id="product-image" alt="">
    <h1 id="product-name"></h1>
    <p id="product-year"></p>
    <p id="product-condition"></p>
    <h2 id="product-price"></h2>

    <a href="index.html" class="btn-hero">← Kembali ke katalog</a>
  </section>

  <script>
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  fetch(`http://localhost:3000/api/products/${productId}`)
    .then(res => {
      if (!res.ok) {
        throw new Error('Produk tidak ditemukan');
      }
      return res.json();
    })
    .then(product => {
      document.getElementById('product-image').src = `../images/${product.image}`;
      document.getElementById('product-name').textContent = product.name;
      document.getElementById('product-year').textContent = `Tahun: ${product.year}`;
      document.getElementById('product-condition').textContent = `Kondisi: ${product.condition}`;
      document.getElementById('product-price').textContent =
        `Rp ${product.price.toLocaleString('id-ID')}`;
    })
    .catch(() => {
      document.body.innerHTML = `
        <section class="container error-page">
          <h1>Produk tidak ditemukan</h1>
          <p>Unit yang kamu cari tidak tersedia atau sudah terjual.</p>
          <a href="index.html" class="btn-hero">Kembali ke katalog</a>
        </section>
      `;
    });
</script>

</body>
</html>
